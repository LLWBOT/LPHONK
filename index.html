<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPHONK – Login / Register</title>

<!-- ===========================
     EMBEDDED STYLE
=========================== -->
<style>
    body {
        margin:0;
        font-family: Arial, sans-serif;
        background:#0a0a0a;
        color:white;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        height:100vh;
        text-align:center;
    }

    .container {
        width:90%;
        max-width:380px;
        padding:25px;
        background:#111;
        border-radius:12px;
        border:1px solid #222;
        box-shadow:0 0 20px rgba(255,255,255,0.05);
    }

    input {
        width:100%;
        padding:12px;
        margin:10px 0;
        border:none;
        border-radius:8px;
        background:#1b1b1b;
        color:white;
        font-size:15px;
    }

    button {
        width:100%;
        padding:12px;
        margin-top:10px;
        background:#4af;
        border:none;
        border-radius:8px;
        font-weight:bold;
        cursor:pointer;
        color:black;
        font-size:15px;
    }

    #authPopup {
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.7);
        display:none;
        align-items:center;
        justify-content:center;
    }

    #authPopup .popup-box {
        background:#111;
        padding:25px;
        border-radius:10px;
        max-width:300px;
        border:1px solid #333;
    }

    #closeAuthPopup {
        margin-top:15px;
        padding:10px;
        background:#4af;
        border:none;
        width:100%;
        border-radius:8px;
        font-weight:bold;
        cursor:pointer;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Welcome to <span style="color:#4af;">LPHONK</span></h2>

    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>
    <button id="registerBtn" style="background:#444;color:white;">Register</button>
</div>

<!-- ===========================
     POPUP
=========================== -->
<div id="authPopup">
    <div class="popup-box">
        <p id="authPopupMessage"></p>
        <button id="closeAuthPopup">Close</button>
    </div>
</div>

<!-- ===========================
     FIREBASE
=========================== -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// =======================
//  Firebase Initialization
// =======================
const firebaseConfig = {
  apiKey: "AIzaSyCzdCYFRu0Pn3TrImTNfG7xN0bcM_a48Ws",
  authDomain: "lphonk.firebaseapp.com",
  projectId: "lphonk",
  storageBucket: "lphonk.firebasestorage.app",
  messagingSenderId: "193256977034",
  appId: "1:193256977034:web:38fd99c1da8e8f37507373",
  measurementId: "G-5QMHMLDHBW"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// =======================
// POPUP
// =======================
function showPopup(msg) {
    document.getElementById("authPopupMessage").innerHTML = msg;
    document.getElementById("authPopup").style.display = "flex";
}
document.getElementById("closeAuthPopup").onclick = () => {
    document.getElementById("authPopup").style.display = "none";
};

// =======================
// GIVE NEW USER COINS
// =======================
async function initNewUser(uid) {
    const ref = db.collection("users").doc(uid);
    const snap = await ref.get();

    if (!snap.exists) {
        await ref.set({
            coins: 15,
            dailyClaim: null,
            youtubeClaimed: false,
            onboardingDone: false
        });
    }
}

// =======================
// REGISTER
// =======================
document.getElementById("registerBtn").onclick = async () => {
    const email = emailInput.value;
    const password = passwordInput.value;

    try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        const user = result.user;

        await user.sendEmailVerification();

        showPopup(`
            Verification email sent to <b>${email}</b><br><br>
            <span id="resendEmail" style="color:#4af;cursor:pointer;">Resend</span>
        `);

        document.getElementById("resendEmail").onclick = () => {
            user.sendEmailVerification();
            showPopup("Verification email resent!");
        };

        await initNewUser(user.uid);

    } catch (err) {
        showPopup(err.message);
    }
};

// =======================
// LOGIN
// =======================
document.getElementById("loginBtn").onclick = async () => {
    const email = emailInput.value;
    const password = passwordInput.value;
    try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const user = result.user;

        await user.reload();

        if (!user.emailVerified) {
            showPopup("Verify your email before logging in.");
            auth.signOut();
            return;
        }
        showPopup("Login successful!");

    } catch (err) {
        showPopup(err.message);
    }
};

// =======================
// AUTH STATE LISTENER
// =======================
auth.onAuthStateChanged(async (user) => {
    if (!user) return; // Not logged in → stay here

    await user.reload();

    if (!user.emailVerified) return;

    // Check onboarding
    const ref = db.collection("users").doc(user.uid);
    const snap = await ref.get();

    if (!snap.exists) return;

    if (snap.data().onboardingDone === false) {
        window.location.href = "onboarding.html";
    } else {
        window.location.href = "dashboard.html";
    }
});
</script>

</body>
</html>
