<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPHONK — Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* Base styles */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;}
body{background:#0a0a0a;color:white;}
h1,h2,h3,h4,h5,h6{color:#ffc600;}
.container{max-width:500px;margin:50px auto;padding:20px;background:#111;border-radius:10px;}
h1{text-align:center;margin-bottom:20px;}
p{margin-bottom:15px;color:#ccc;font-size:0.95rem;}
input,textarea{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;background:#1b1b1b;color:white;}
button{padding:12px 20px;border:none;border-radius:8px;font-weight:700;margin-top:10px;cursor:pointer;transition:0.2s;}
button.primary{background:linear-gradient(90deg,#ffc600,#ffea00);color:black;}
button.secondary{background:#444;color:white;margin-left:10px;}
button:hover{opacity:0.85;}
.actions{display:flex;justify-content:center;gap:10px;margin-top:20px;}
@media(max-width:480px){.container{margin:20px;padding:15px;}}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <h1>Welcome to LPHONK</h1>
  <p>Help us get to know your preferences. You can skip any question.</p>
  
  <label for="name">Your Name</label>
  <input type="text" id="name" placeholder="Type your name">

  <label for="favFunk">Favourite Brazilian Funk</label>
  <input type="text" id="favFunk" placeholder="Type your favourite funk">

  <label for="experience">Any previous experience creating vocals or beats?</label>
  <textarea id="experience" rows="3" placeholder="Type here"></textarea>

  <div class="actions">
    <button class="secondary" id="skipBtn">Skip</button>
    <button class="primary" id="continueBtn">Continue</button>
  </div>
</div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCzdCYFRu0Pn3TrImTNfG7xN0bcM_a48Ws",
  authDomain: "lphonk.firebaseapp.com",
  projectId: "lphonk",
  storageBucket: "lphonk.firebasestorage.app",
  messagingSenderId: "193256977034",
  appId: "1:193256977034:web:38fd99c1da8e8f37507373",
  measurementId: "G-5QMHMLDHBW"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Ensure user is logged in and not completed onboarding
auth.onAuthStateChanged(async user=>{
  if(!user) window.location.href="index.html"; // redirect if logged out
  else {
    const doc = await db.collection("users").doc(user.uid).get();
    if(doc.exists && doc.data().onboardingCompleted) window.location.href="dashboard.html"; // prevent revisiting
  }
});

// Elements
const skipBtn = document.getElementById("skipBtn");
const continueBtn = document.getElementById("continueBtn");
const nameInput = document.getElementById("name");
const favFunkInput = document.getElementById("favFunk");
const experienceInput = document.getElementById("experience");

// Skip onboarding
skipBtn.addEventListener("click", async ()=>{
  const user = auth.currentUser;
  if(user){
    await db.collection("users").doc(user.uid).set({onboardingCompleted:true},{merge:true});
    window.location.href="dashboard.html";
  }
});

// Continue onboarding
continueBtn.addEventListener("click", async ()=>{
  const user = auth.currentUser;
  if(user){
    const name = nameInput.value || "";
    const favFunk = favFunkInput.value || "";
    const experience = experienceInput.value || "";

    await db.collection("users").doc(user.uid).set({
      onboardingCompleted:true,
      name:name,
      favouriteFunk:favFunk,
      experience:experience
    }, {merge:true});

    window.location.href="dashboard.html";
  }
});
</script>
</body>
</html>
